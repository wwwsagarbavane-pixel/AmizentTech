<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="azLogoGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12457F" />
      <stop offset="100%" stop-color="#1B58A6" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="68" height="68" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12457F" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Symbol with Clear Space -->
  <g transform="translate(6, 8)" filter="url(#shadow)">
    <rect width="48" height="48" rx="12" fill="url(#azLogoGrad)" />
    <!-- Dynamic A-node structure with upskill trajectory -->
    <path d="M14 34L24 14L34 34" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 27H30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="14" r="3.5" fill="#FFFFFF" />
    <circle cx="14" cy="34" r="2.8" fill="#DCE7F2" />
    <circle cx="34" cy="34" r="2.8" fill="#DCE7F2" />
    <!-- Guiding Agent Spark -->
    <path d="M33 13L35 17L39 18L35 19L33 23L31 19L27 18L31 17Z" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Typography: AmIzent Tech Services -->
  <g transform="translate(66, 12)">
    <!-- Brand Name -->
    <text x="0" y="26" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#12457F">
      Am<tspan fill="#1B58A6">I</tspan>zent
    </text>
    
    <!-- Tagline / Subtitle -->
    <text x="0.5" y="40" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.2" fill="#4A607A">
      TECH SERVICES
    </text>
  </g>
</svg>
